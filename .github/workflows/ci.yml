name: PR05 evidence

on:
  push:
  pull_request:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
  COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - name: Prepare Node for checkout (linux-x64)
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils ros-jazzy-ament-mypy
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz
          printf '%s  %s\n' c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2 /tmp/node.tar.xz | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build ROS packages and run unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export ROS_DOMAIN_ID=174
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/sim.launch.py"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/config/patrol.yaml"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          python3 -m py_compile src/course_bringup/launch/sim.launch.py src/course_bringup/course_bringup/pose_relay.py src/course_bringup/course_bringup/pose_subscriber.py
          colcon test --packages-select patrol course_bringup --event-handlers console_direct+
          colcon test-result --verbose
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Check PR05 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
